<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Информация об игроке</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>Информация об игроке</h1>
<!-- Личная информация игрока -->
<h2>
    <span th:text="${player.fname}">Имя</span>
    <span th:text="${player.sname}">Фамилия</span>
</h2>
<hr>
<!-- Фотография -->
<h2>Фотография</h2>
<img th:src="@{'/' + ${photo}}" alt="Фотография игрока" width="300">
<hr>
<p>
    <b>Номер:</b>
    <span th:text="${player.jersey}">номер</span>
</p>
<p>
    <b>Позиция:</b>
    <span th:text="${player.position}">позиция</span>
</p>
<p>
    <b>Дата рождения:</b>
    <span th:text="${#temporals.format(player.birthday, 'dd.MM.yy')}">дата рождения</span>
</p>
<p>
    <b>Вес:</b>
    <span th:text="${player.weight}">вес</span>
</p>
<p>
    <b>Рост:</b>
    <span th:text="${player.height}">рост</span>
</p>
<p>
    <b>Город рождения:</b>
    <span th:text="${player.birthcity}">город</span>
</p>
<p>
    <b>Штат рождения:</b>
    <span th:text="${player.birthstate}">штат</span>
</p>

<!-- Послужной список -->
<h2>Послужной список</h2>
<table border="1">
    <thead>
    <tr>
        <th>Сезон</th>
        <th>Команда</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="history : ${playerHistory}">
        <td th:text="${history.season}">
            Сезон
        </td>
        <td th:text="${history.team}">
            Команда
        </td>
    </tr>
    </tbody>
</table>
<br>
<a href="/">
    <button>Назад к списку игроков</button>
</a>
</body>
</html>
